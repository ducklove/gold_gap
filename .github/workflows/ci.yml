name: CI

on:
  push:
    # data 브랜치는 데이터 파일만 담는 전용 브랜치 — 코드 CI 대상 아님
    branches: ['**', '!data']
    paths-ignore:
      - 'data.json'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - 'data.json'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # 골든 회귀 테스트(병합·구간 재계산)가 실제 데이터를 입력으로 사용
      - name: Fetch golden data.json (data 브랜치)
        run: |
          git fetch --depth=1 origin data
          git show FETCH_HEAD:data.json > data.json

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        run: pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # static/js 순수 모듈(periods/stats/market/decompose/format/i18n) 단위 테스트
      # Node 20·22+ 공통 — 디렉터리 인자는 Node 22+에서 모듈로 해석돼 실패하고, 따옴표 친 glob은
      # Node 21+만 해석한다. 셸이 펼치는 비인용 glob은 모든 버전에서 동작(npm test와 동일).
      - name: Test (node --test)
        run: node --test tests/js/*.test.mjs

      # 골든 data.json으로 허브용 summary.json을 오프라인 생성해 envelope v1 검증까지 확인
      - name: Hub summary smoke (envelope v1)
        run: |
          python -m goldgap.hub_summary --data data.json --summary /tmp/summary.json --version /tmp/version.json
          python goldgap/vc_publish.py validate /tmp/summary.json
